name: thermal-parity

# GPU-versus-CPU parity for the thermal family (add-thermal-cpu-port, design D6).
#
# The CPU ports in HighMap/src/erosion/thermal_cpu.cpp transcribe the OpenCL
# kernels; this job is the only place with an OpenCL device (PoCL, CPU ICD), so
# it is the oracle for the parity claim. A skipped comparison (no device) is a
# failure, not a pass.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  parity:
    name: GPU-vs-CPU thermal parity
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libglm-dev libfuse2 ocl-icd-opencl-dev \
            pocl-opencl-icd libassimp-dev libopencv-dev libfftw3-dev \
            libgsl-dev libspdlog-dev

      - name: Report the OpenCL platform
        run: |
          sudo apt-get -y install clinfo
          clinfo -l || true

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DHIGHMAP_ENABLE_DOCS=OFF
          -DHIGHMAP_ENABLE_EXAMPLES=OFF
          -DHIGHMAP_ENABLE_BENCHMARKS=OFF
          -DHIGHMAP_ENABLE_TESTS=ON
          -S .

      - name: Build the test binary
        run: cmake --build build --target highmap_tests --parallel

      - name: Run the thermal parity suite
        run: |
          set -euo pipefail
          ./build/bin/highmap_tests \
            --gtest_filter='ThermalCpuInvariants.*:ThermalParity.*' \
            --gtest_output=xml:build/thermal-parity.xml \
            | tee build/thermal-parity.log

          if grep -qE 'result="skipped"|skipped="[1-9]' build/thermal-parity.xml; then
            echo "::error::parity cases were skipped - no OpenCL device was available"
            exit 1
          fi

          if ! grep -q '^PARITY,' build/thermal-parity.log; then
            echo "::error::no PARITY metric lines were produced"
            exit 1
          fi

      - name: Publish the metrics
        if: always()
        run: |
          {
            echo "### Thermal GPU/CPU parity metrics"
            echo ""
            echo "Oracle: PoCL (CPU OpenCL ICD) on ubuntu-latest."
            echo ""
            echo '```'
            grep '^PARITY,' build/thermal-parity.log || echo "no metrics"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermal-parity
          path: |
            build/thermal-parity.xml
            build/thermal-parity.log
          if-no-files-found: error
          retention-days: 30
