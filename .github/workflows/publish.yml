name: publish

# Tag-driven npm release (add-npm-tag-publish, AD-031): validate the tag,
# rebuild and test the tagged commit, publish with npm trusted publishing
# (OIDC) and provenance, then create the GitHub Release.
#
# One-time setup and the maintainer procedure live in docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never run two releases at once; a retried tag must not interleave with the
# original run (design D6).
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm-publish
    permissions:
      contents: write # GitHub Release
      id-token: write # npm trusted publishing (OIDC)

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate the tag against package.json
        id: guard
        shell: bash
        run: node scripts/release-guard.mjs "$GITHUB_REF_NAME"

      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit that is not reachable from main"
            exit 1
          fi

      - name: Reject an already published version
        shell: bash
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "highmap-wasm@$VERSION" version >/dev/null 2>&1; then
            echo "::error::highmap-wasm@$VERSION is already published - bump the version before tagging"
            exit 1
          fi

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-6.0.13-${{ runner.os }}

      - name: Install Emscripten 6.0.13
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$HOME/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          ./emsdk install 6.0.13
          ./emsdk activate 6.0.13
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      - name: Install package dependencies
        run: npm ci

      - name: Build the wasm and JS artifacts from the tag
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-wasm.sh
          node scripts/build-js.mjs

      - name: Run the package tests
        run: npm test

      - name: Install the npm CLI that supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "npm@^11.15.0"
          npm --version

      - name: Check the published file list
        run: node scripts/release-pack-check.mjs

      - name: Publish with trusted publishing
        shell: bash
        env:
          DIST_TAG: ${{ steps.guard.outputs.dist_tag }}
        run: |
          set -euo pipefail
          npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then
            prerelease="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "highmap-wasm $VERSION"
          else
            gh release create "$TAG" \
              --verify-tag \
              --generate-notes \
              --title "highmap-wasm $VERSION" \
              $prerelease
          fi
