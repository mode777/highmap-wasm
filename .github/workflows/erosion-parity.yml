name: erosion-parity

# GPU-versus-CPU parity for the thermal and hydraulic families
# (add-thermal-cpu-port, add-hydraulic-cpu-ports).
#
# The CPU ports in HighMap/src/erosion/{thermal,hydraulic}_cpu.cpp transcribe
# the OpenCL kernels; this job is the only place with an OpenCL device (PoCL,
# CPU ICD), so it is the oracle for the parity claim. A skipped comparison (no
# device) is a failure, not a pass; the only allowed skip is the recorded
# float-image-format limitation.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_device:
        description: >-
          Simulate a device-less runner (sets OCL_ICD_VENDORS to a missing
          path) to prove the skip guard fails the job.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  parity:
    name: GPU-vs-CPU erosion parity
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Test hook for the no-device path: must land in $GITHUB_ENV before the
      # platform check and the test run.
      - name: Simulate a device-less runner
        if: ${{ inputs.no_device }}
        run: echo "OCL_ICD_VENDORS=/nonexistent" >> "$GITHUB_ENV"

      - name: Install system dependencies
        timeout-minutes: 45
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true"
          sudo apt-get $APT_OPTS update
          # --no-install-recommends keeps the download small (the runner mirror
          # can be slow); the -dev packages carry their build dependencies.
          sudo apt-get $APT_OPTS -y --no-install-recommends install \
            libglm-dev ocl-icd-opencl-dev pocl-opencl-icd libassimp-dev \
            libopencv-dev libfftw3-dev libgsl-dev libspdlog-dev

      - name: Report the OpenCL platform
        run: |
          sudo apt-get -y install clinfo
          platforms="$(clinfo -l 2>/dev/null || true)"
          echo "${platforms}"
          if [ -z "${platforms}" ]; then
            # Upstream's tests/src/main.cpp calls gpu::init_opencl() before
            # gtest and aborts when no platform exists, so fail here with a
            # clear message instead of letting the binary abort.
            echo "::error::no OpenCL platform available - parity cannot be verified"
            exit 1
          fi

      # C17 for the third-party C sources: newer runner images default GCC to C23,
      # where a `void f()` declaration means "no arguments" and the vendored
      # nn-c (triangle.c) K&R definitions stop compiling. The same failure breaks
      # the upstream `CMake on multiple platforms` job.
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-std=gnu17
          -DHIGHMAP_ENABLE_DOCS=OFF
          -DHIGHMAP_ENABLE_EXAMPLES=OFF
          -DHIGHMAP_ENABLE_BENCHMARKS=OFF
          -DHIGHMAP_ENABLE_TESTS=ON
          -S .

      - name: Build the test binary
        timeout-minutes: 75
        # Bounded parallelism: plain `--parallel` translates to `gmake -j`
        # (unlimited) for Unix Makefiles, which exhausts the runner's memory.
        run: cmake --build build --target highmap_tests --parallel 4

      - name: Run the thermal parity suite
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ./build/bin/highmap_tests \
            --gtest_filter='ThermalCpuInvariants.*:ThermalParity.*' \
            --gtest_output=xml:build/thermal-parity.xml \
            | tee build/thermal-parity.log

          if ! grep -q '^PARITY,' build/thermal-parity.log; then
            echo "::error::no thermal PARITY metric lines were produced"
            exit 1
          fi

      - name: Run the hydraulic parity suite
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ./build/bin/highmap_tests \
            --gtest_filter='HydraulicCpuInvariants.*:HydraulicParity.*' \
            --gtest_output=xml:build/hydraulic-parity.xml \
            | tee build/hydraulic-parity.log

          if ! grep -q '^PARITY,' build/hydraulic-parity.log; then
            echo "::error::no hydraulic PARITY metric lines were produced"
            exit 1
          fi

      - name: Reject unexpected skips
        run: |
          set -euo pipefail
          for xml in build/thermal-parity.xml build/hydraulic-parity.xml; do
            if grep -qE 'result="skipped"|skipped="[1-9]' "$xml"; then
              # Only the float-image-format skip is acceptable: the image2d
              # kernels (thermal_conserve, Schott, vpipes) need a device that
              # can create CL_R or CL_RGBA float images. Any other skip -
              # notably a missing device - fails the job.
              unexpected="$(grep -o 'message="[^"]*"' "$xml" \
                | grep -v 'image support' || true)"
              if [ -n "${unexpected}" ]; then
                echo "::error::parity cases were skipped in ${xml}:"
                echo "${unexpected}"
                exit 1
              fi
            fi
          done

      - name: Publish the metrics
        if: always()
        run: |
          {
            echo "### Thermal GPU/CPU parity metrics"
            echo ""
            echo "Oracle: PoCL (CPU OpenCL ICD) on ubuntu-latest."
            echo ""
            echo '```'
            grep '^PARITY,' build/thermal-parity.log || echo "no metrics"
            echo '```'
            echo ""
            echo "### Hydraulic GPU/CPU parity metrics"
            echo ""
            echo "Oracle: PoCL (CPU OpenCL ICD) on ubuntu-latest."
            echo ""
            echo '```'
            grep '^PARITY,' build/hydraulic-parity.log || echo "no metrics"
            echo '```'
            echo ""
            echo "### McDonald aggregate metrics"
            echo ""
            echo '```'
            grep '^PARITY_AGG,' build/hydraulic-parity.log || echo "no metrics"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erosion-parity
          path: |
            build/thermal-parity.xml
            build/thermal-parity.log
            build/hydraulic-parity.xml
            build/hydraulic-parity.log
          if-no-files-found: warn
          retention-days: 30
