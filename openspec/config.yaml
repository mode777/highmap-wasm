schema: spec-driven

context: |
  Language: en
  All artifacts must be written in en.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Advisory guidance for how apply and archive work should be conducted.
operations:
  apply:
    guidance:
      - After apply is done, always commit the implemented work and push it to
        main. Verify the git identity is mode777 before committing.
      - Include the change artifacts, tests, documentation, and configuration
        updates in the commit; do not leave applied work uncommitted.
  archive:
    guidance:
      - Always commit the work after a successful archive and push it to main.
        Stage the archived change, the synced main specs, and the implemented
        changes together and create one reviewable commit before starting the
        next change. Verify the git identity is mode777 before committing.
