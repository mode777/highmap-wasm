schema: spec-driven

context: |
  Language: en
  All artifacts must be written in en.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Advisory guidance for how apply and archive work should be conducted.
operations:
  archive:
    guidance:
      - Always commit the work after a successful archive. Stage the archived
        change, the synced main specs, and the implemented changes together and
        create one reviewable commit before starting the next change. Verify the
        git identity is mode777 before committing.
